name: Update tides

on:
  schedule:
    # GitHub runs scheduled jobs on a best-effort basis and sometimes skips them,
    # so ask every 3 hours; nothing is committed when the data hasn't changed.
    - cron: "41 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_tides.mjs, data.js, .github/workflows/tides.yml]

permissions:
  contents: write

concurrency:
  group: tides
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/fetch_tides.mjs
        timeout-minutes: 5
      - run: node scripts/check.mjs
      - name: Commit if changed
        run: |
          git config user.name "tide-wolf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tides.json
          git diff --cached --quiet && exit 0
          git commit -m "Update tides"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
