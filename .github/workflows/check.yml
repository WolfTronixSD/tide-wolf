name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check.mjs
      - run: for f in app.js data.js version.js sw.js scripts/*.mjs; do node --check "$f" || exit 1; done
